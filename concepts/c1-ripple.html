<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ripple Field</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Layout: three-column bento, About spans both rows in the centre; cards fly out from the screen centre */
:root {
  --bg: #050507; --glass: rgba(255,255,255,.055); --glass-hi: rgba(255,255,255,.09);
  --line: rgba(255,255,255,.12); --line-hi: rgba(255,255,255,.28);
  --fg: #f2f3f7; --muted: #9597a6; --accent: #8fb0ff; --ok: #5be39a;
  --sans: "Geist", ui-sans-serif, system-ui, sans-serif; --mono: "Geist Mono", ui-monospace, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box }
html, body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--sans) }
#field { position: fixed; inset: 0; width: 100%; height: 100% }
main { position: relative; min-height: 100vh; display: grid; place-items: center;
  padding-block: 40px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
.grid { display: grid; width: 100%; max-width: 1120px; gap: 16px;
  grid-template-columns: repeat(3, minmax(0, 1fr)); grid-template-rows: repeat(2, minmax(230px, auto));
  grid-template-areas: "p a e" "b a c" }
.card { position: relative; background: var(--glass); border: 1px solid var(--line); border-radius: 22px; padding: 22px 24px;
  backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
  display: flex; flex-direction: column; justify-content: space-between; gap: 24px; cursor: pointer;
  transition: translate .25s cubic-bezier(.2,.8,.2,1), border-color .2s, background .2s }
.card:hover { translate: 0 -4px; border-color: var(--line-hi); background: var(--glass-hi) }
.card:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px }
.path { font: 500 12px/1 var(--mono); color: var(--muted); letter-spacing: .02em; display: flex; justify-content: space-between }
.path .arrow { transition: translate .25s }
.card:hover .arrow { translate: 3px -3px; color: var(--fg) }
h2 { margin: 0 0 6px; font-size: clamp(24px, 2.4vw, 30px); font-weight: 600; letter-spacing: -.02em; text-wrap: balance }
.card p { margin: 0; color: var(--muted); font-size: 15px }
.about { grid-area: a; justify-content: center; align-items: center; text-align: center; gap: 18px }
.avatar { width: 84px; height: 84px; border-radius: 50%; display: grid; place-items: center; font: 600 28px var(--sans);
  background: radial-gradient(circle at 30% 25%, #c9d6ff, #4a5bd8 70%); color: #0b0d1a }
.about h1 { margin: 0; font-size: clamp(26px, 2.6vw, 32px); font-weight: 650; letter-spacing: -.025em; text-wrap: balance }
.role { color: var(--muted); font-size: 16px; margin: 4px 0 0 }
.extra { display: flex; flex-direction: column; align-items: center; gap: 14px; transition: opacity .5s, translate .5s }
.pending .extra { opacity: 0; translate: 0 10px }
.email { font: 500 14px var(--mono); color: var(--accent); user-select: all }
.status { display: inline-flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px }
.status i { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 10px var(--ok) }
.chips { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center }
.chip { font: 500 12px var(--mono); padding: 5px 10px; border: 1px solid var(--line); border-radius: 999px; color: var(--fg) }
dialog { width: min(560px, calc(100vw - 32px)); background: #0d0e14; color: var(--fg); border: 1px solid var(--line-hi); border-radius: 24px; padding: 28px }
dialog::backdrop { background: rgba(3,3,6,.6); backdrop-filter: blur(6px) }
dialog[open] { animation: pop .35s cubic-bezier(.16,1,.3,1) }
@keyframes pop { from { opacity: 0; transform: scale(.94) translateY(8px) } }
dialog h3 { margin: 10px 0 6px; font-size: 30px; letter-spacing: -.02em }
dialog p { color: var(--muted); line-height: 1.6 }
dialog .note { font: 12px var(--mono); color: var(--muted); border-top: 1px solid var(--line); padding-top: 14px; margin-top: 20px }
.close { float: right; background: none; border: 1px solid var(--line); color: var(--fg); border-radius: 999px; padding: 6px 12px; font: 12px var(--mono); cursor: pointer }
@media (max-width: 820px) {
  .grid { grid-template-columns: 1fr; grid-template-rows: none; grid-template-areas: "a" "p" "e" "b" "c" }
  .card { min-height: 170px }
}
</style>
</head>
<body>
<canvas id="field" aria-hidden="true"></canvas>
<main>
  <div class="grid">
    <article class="card" data-id="projects" style="grid-area:p"><div class="path"><span>/projects</span><span class="arrow">↗</span></div><div><h2>Projects</h2><p>My creative work</p></div></article>
    <article class="card" data-id="experience" style="grid-area:e"><div class="path"><span>/experience</span><span class="arrow">↗</span></div><div><h2>Experience</h2><p>My professional journey</p></div></article>
    <article class="card" data-id="blog" style="grid-area:b"><div class="path"><span>/blog</span><span class="arrow">↗</span></div><div><h2>Blog</h2><p>Thoughts &amp; insights</p></div></article>
    <article class="card" data-id="current" style="grid-area:c"><div class="path"><span>/now</span><span class="arrow">↗</span></div><div><h2>Current Work</h2><p>What I'm building now</p></div></article>
    <article class="card about pending" data-id="about">
      <div class="avatar" data-person="initials"></div>
      <div><h1 data-person="name"></h1><p class="role" data-person="role"></p></div>
      <div class="extra">
        <span class="email" data-person="email" data-noopen></span>
        <span class="status"><i></i><span data-person="status"></span></span>
        <div class="chips" data-skills="chip"></div>
      </div>
    </article>
  </div>
</main>
<dialog id="panel" aria-labelledby="panel-title">
  <button class="close" data-close>Esc</button>
  <div class="path"><span data-slot="path"></span></div>
  <h3 id="panel-title" data-slot="title"></h3>
  <p data-slot="kicker"></p>
  <p data-slot="body"></p>
  <p class="note">Placeholder content. This section is still being built.</p>
</dialog>
<script src="shared.js"></script>
<script>
const field = Kit.Field(document.getElementById('field'), {
  spacing: 16, speed: 700, band: 110, life: 1900, push: 16,
  render(ctx, dots) {
    ctx.fillStyle = '#ffffff'
    for (const d of dots) {
      const s = 1.2 + d.e * 1.8
      ctx.globalAlpha = 0.13 + d.e * 0.8
      ctx.fillRect(d.x - s / 2, d.y - s / 2, s, s)
    }
    ctx.globalAlpha = 1
  },
})
Kit.fillPerson()
Kit.wirePanels(field)

const order = ['projects', 'experience', 'blog', 'current', 'about'].map(id => document.querySelector(`[data-id="${id}"]`))
Kit.assemble(order, (el, i, dx, dy) => el.dataset.id === 'about'
  ? { delay: 520, duration: 900, keyframes: [
      { transform: `translate(${dx}px,${dy}px) scale(.35,.18)`, opacity: 0 },
      { transform: 'scale(1,.45)', opacity: 1, offset: .45 },
      { transform: 'none', opacity: 1 } ] }
  : { delay: i * 80, duration: 620, keyframes: [
      { transform: `translate(${dx}px,${dy}px) scale(.4)`, opacity: 0 },
      { transform: 'none', opacity: 1 } ] },
  (el, instant) => {
    const c = Kit.centerOf(el)
    if (el.dataset.id === 'about') { el.classList.remove('pending'); if (!instant) field.ripple(c.x, c.y, 1.6) }
    else if (!instant) field.ripple(c.x, c.y, 0.7)
  })
</script>
</body>
</html>
