<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Paper Fold</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Karla:wght@400;500;700&family=DM+Mono:wght@400;500&display=swap">
<style>
/* Layout: coloured paper sheets on a cutting mat. Opening an entry folds the sheets away and unfolds that entry's sheets in a chain, each hinged off the last */
:root {
  --mat: #1b5646; --mat-line: #6fb39a; --fg: #1f2420; --kraft: #d9b98c; --sky: #b9d3ea; --blush: #f2c6c2; --sage: #c9d8b6; --butter: #f1dd94; --navy: #23324d; --on-navy: #f4efe4;
  --tape: rgba(255,236,150,.88);
  --serif: "Young Serif", Georgia, serif; --sans: "Karla", system-ui, sans-serif; --mono: "DM Mono", ui-monospace, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box }
html, body { margin: 0; background: var(--mat); color: var(--fg); font: 15px/1.5 var(--sans) }
#field { position: fixed; inset: 0; width: 100%; height: 100% }
main { position: relative; min-height: 100vh; display: grid; place-items: center; perspective: 1600px;
  padding-block: 48px; padding-left: max(28px, env(safe-area-inset-left, 0px)); padding-right: max(28px, env(safe-area-inset-right, 0px)) }
#desk { width: 100%; max-width: 1100px; display: grid; gap: 18px }
#desk.home { grid-template-columns: repeat(3, minmax(0, 1fr)); grid-template-rows: repeat(2, minmax(220px, auto)); grid-template-areas: "projects about experience" "blog about current" }
#desk.section { grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)) }
.sheet { --p: var(--kraft); position: relative; background: var(--p); padding: 22px 24px; display: flex; flex-direction: column; justify-content: space-between; gap: 18px; min-height: 190px;
  background-image: linear-gradient(135deg, rgba(255,255,255,.22), rgba(0,0,0,.06)), linear-gradient(45deg, transparent 49.6%, rgba(0,0,0,.05) 50%, transparent 50.4%);
  box-shadow: 0 1px 1px rgba(0,0,0,.15), 0 10px 24px -8px rgba(0,0,0,.45); transition: translate .25s, rotate .25s, box-shadow .25s; backface-visibility: hidden }
.sheet.go { cursor: pointer }
.sheet.go:hover { translate: 0 -4px; rotate: -.6deg; box-shadow: 0 1px 1px rgba(0,0,0,.15), 0 22px 34px -12px rgba(0,0,0,.55) }
.sheet:focus-visible, .tape:focus-visible { outline: 3px dashed var(--butter); outline-offset: 4px }
.sheet .lab { font: 500 12px var(--mono); opacity: .7; display: flex; justify-content: space-between }
.sheet h2 { margin: 0; font: 400 clamp(26px, 2.6vw, 34px)/1.05 var(--serif) }
.sheet p { margin: 6px 0 0 }
.about { grid-area: about; --p: var(--navy); color: var(--on-navy); justify-content: center; gap: 14px }
.about h1 { margin: 0; font: 400 clamp(28px, 3vw, 40px)/1 var(--serif); text-wrap: balance; overflow-wrap: anywhere }
.about .email { font: 500 14px var(--mono); user-select: all; overflow-wrap: anywhere }
.stamp { align-self: flex-start; font: 500 12px var(--mono); border: 2px solid currentColor; padding: 4px 10px; border-radius: 4px; rotate: -4deg; color: var(--butter) }
.head { grid-column: 1 / -1; --p: #f4efe4; flex-direction: row; align-items: center; flex-wrap: wrap; min-height: 0; padding: 18px 24px }
.head h1 { margin: 0; font: 400 clamp(32px, 4.4vw, 54px)/1 var(--serif) }
.head .lab { margin-left: auto }
.tape { font: 500 13px var(--mono); color: var(--fg); background: var(--tape); border: 0; padding: 9px 18px; rotate: -3deg; cursor: pointer; box-shadow: 0 2px 4px rgba(0,0,0,.15);
  clip-path: polygon(3% 0, 97% 4%, 100% 50%, 96% 100%, 2% 96%, 0 50%) }
.tape:hover { rotate: -1deg }
.bar { height: 6px; background: rgba(0,0,0,.12); margin-top: 12px } .bar span { display: block; height: 100%; background: var(--fg) }
@media (max-width: 820px) {
  #desk.home { grid-template-columns: 1fr; grid-template-rows: none; grid-template-areas: "about" "projects" "experience" "blog" "current" }
  main { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
}
</style>
</head>
<body>
<canvas id="field" aria-hidden="true"></canvas>
<main><div id="desk" class="home"></div></main>
<script src="kit2.js"></script>
<script>
const { PERSON, SECTIONS, SECTION, ITEMS, esc } = Kit
const PAPERS = ['kraft', 'sky', 'blush', 'sage', 'butter']
const desk = document.getElementById('desk')

// Cutting mat: grid lines with ruler numbers; intersections glow as ripples pass
const field = Kit.Field(document.getElementById('field'), {
  spacing: 24, speed: 650, band: 90, life: 1600, push: 5, mouseRadius: 120, mousePush: 4,
  render(ctx, dots, W, H) {
    ctx.strokeStyle = '#6fb39a'; ctx.lineWidth = 1
    for (let x = 0, i = 0; x < W; x += 24, i++) { ctx.globalAlpha = i % 5 ? .1 : .22; ctx.beginPath(); ctx.moveTo(x + .5, 0); ctx.lineTo(x + .5, H); ctx.stroke() }
    for (let y = 0, i = 0; y < H; y += 24, i++) { ctx.globalAlpha = i % 5 ? .1 : .22; ctx.beginPath(); ctx.moveTo(0, y + .5); ctx.lineTo(W, y + .5); ctx.stroke() }
    ctx.globalAlpha = .45; ctx.fillStyle = '#6fb39a'; ctx.font = '10px "DM Mono", monospace'
    for (let x = 120, n = 5; x < W; x += 120, n += 5) ctx.fillText(n, x + 3, 12)
    for (let y = 120, n = 5; y < H; y += 120, n += 5) ctx.fillText(n, 3, y - 3)
    ctx.fillStyle = '#f1dd94'
    for (const d of dots) if (d.e > .04) { ctx.globalAlpha = d.e; const s = 2 + d.e * 4; ctx.fillRect(d.x - s / 2, d.y - s / 2, s, s) }
    ctx.globalAlpha = 1
  },
})

const homeHTML = () => SECTIONS.map((s, i) => s.id === 'about'
  ? `<article class="sheet go about" data-go="about"><span class="stamp">${esc(PERSON.status)}</span><h1>${esc(PERSON.name)}</h1>
      <p>${esc(PERSON.role)}</p><span class="email">${esc(PERSON.email)}</span><span class="lab"><span>${esc(PERSON.skills.slice(0, 3).join(' · '))}</span><span>open →</span></span></article>`
  : `<article class="sheet go" data-go="${s.id}" style="grid-area:${s.id};--p:var(--${PAPERS[i]})">
      <span class="lab"><span>${s.path}</span><span>${ITEMS[s.id].length} sheets</span></span><div><h2>${esc(s.title)}</h2><p>${esc(s.kicker)}</p></div></article>`).join('')
const sectionHTML = id => `<header class="sheet head"><button class="tape" type="button" data-back>← back to the desk</button>
    <h1>${esc(id === 'about' ? 'About' : SECTION[id].title)}</h1><span class="lab">${ITEMS[id].length} sheets · sample content</span></header>` +
  ITEMS[id].map((it, i) => `<article class="sheet" style="--p:var(--${PAPERS[i % PAPERS.length]})"><span class="lab"><span>${esc(it.meta)}</span></span>
    <div><h2>${esc(it.title)}</h2><p>${esc(it.text)}</p>${it.progress != null ? `<div class="bar"><span style="width:${it.progress * 100}%"></span></div>` : ''}</div></article>`).join('')

// Each sheet hinges off its neighbour: from the left edge when something sits to its left, otherwise from the top
function hinge(el) {
  const r = Kit.rectOf(el), d = Kit.rectOf(desk)
  return r.left - d.left > 8 ? { origin: 'left center', axis: 'rotateY', from: -120 } : { origin: 'center top', axis: 'rotateX', from: 120 }
}
function unfold() {
  return Kit.animateAll([...desk.children], (el, i) => {
    const h = hinge(el)
    return { delay: i * 120, duration: 620, easing: 'cubic-bezier(.3,1.25,.5,1)',
      keyframes: [
        { transformOrigin: h.origin, transform: `perspective(1100px) ${h.axis}(${h.from}deg)`, filter: 'brightness(.55)', opacity: 0 },
        { opacity: 1, offset: .15 },
        { transformOrigin: h.origin, transform: `perspective(1100px) ${h.axis}(0deg)`, filter: 'brightness(1)', opacity: 1 }] }
  }, (el, i, instant) => { if (!instant) { const c = Kit.centerOf(el); field.ripple(c.x, c.y, .7) } })
}
function foldAway(clicked) {
  const els = [...desk.children]
  const order = clicked ? [...els.filter(e => e !== clicked), clicked] : els.reverse()
  return Kit.animateAll(order, (el, i) => {
    const h = hinge(el)
    return { delay: i * 70, duration: 380, easing: 'cubic-bezier(.6,0,.8,.4)', fill: 'forwards',
      keyframes: [
        { transformOrigin: h.origin, transform: `perspective(1100px) ${h.axis}(0deg)`, filter: 'brightness(1)', opacity: 1 },
        { transformOrigin: h.origin, transform: `perspective(1100px) ${h.axis}(${h.from * .8}deg)`, filter: 'brightness(.5)', opacity: 0 }] }
  })
}

let view = null, busy = false
async function go(target, clicked) {
  if (busy || target === view) return
  busy = true
  if (clicked) { const c = Kit.centerOf(clicked); field.ripple(c.x, c.y, 1.3) }
  if (view) await foldAway(clicked)
  view = target
  desk.className = target === 'home' ? 'home' : 'section'
  desk.innerHTML = target === 'home' ? homeHTML() : sectionHTML(target)
  desk.querySelectorAll('[data-go]').forEach(el => Kit.pressable(el, () => go(el.dataset.go, el)))
  desk.querySelectorAll('[data-back]').forEach(el => el.addEventListener('click', () => go('home')))
  scrollTo(0, 0)
  await unfold()
  const f = desk.querySelector('[data-back], [data-go]'); if (f) f.focus({ preventScroll: true })
  busy = false
}
Kit.onBack(() => go('home'))
go('home')
</script>
</body>
</html>
