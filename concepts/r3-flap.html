<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Split-Flap</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500&display=swap">
<style>
/* Layout: a station departures board. Each block is a board panel whose title clatters through letters as it spawns; the backdrop is a wall of tiny flaps */
:root {
  --wall: #0e0f10; --panel: #18191b; --flap: #222326; --flap-hi: #2c2d31; --seam: #0a0a0b; --ink: #f1e9d2; --amber: #f5b400; --mute: #8f8a7c; --green: #6fdc8c;
  --cond: "Barlow Condensed", "Arial Narrow", sans-serif; --body: "Barlow", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box }
html, body { margin: 0; background: var(--wall); color: var(--ink); font: 15px/1.45 var(--body) }
#field { position: fixed; inset: 0; width: 100%; height: 100% }
header { position: relative; z-index: 2; display: flex; align-items: center; gap: 18px; height: 64px; border-bottom: 2px solid #000; background: #121314;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); font: 600 15px var(--cond); letter-spacing: .12em; text-transform: uppercase }
header .board { color: var(--amber) }
header .clock { margin-left: auto; font-variant-numeric: tabular-nums; color: var(--ink) }
.back { font: 700 14px var(--cond); letter-spacing: .1em; text-transform: uppercase; background: var(--amber); color: #111; border: 0; padding: 8px 14px; cursor: pointer }
.back[hidden] { display: none }
.back:focus-visible, .card:focus-visible { outline: 2px solid var(--amber); outline-offset: 3px }
main { position: relative; padding-block: 16px 40px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
#stage { position: relative; height: calc(100vh - 64px - 56px) }
.card { position: absolute; background: var(--panel); border: 2px solid #000; border-radius: 6px; padding: 16px 18px; overflow: hidden; display: flex; flex-direction: column; justify-content: space-between; gap: 12px;
  box-shadow: inset 0 1px 0 rgba(255,255,255,.05), 0 14px 30px -14px rgba(0,0,0,.9);
  transition: left .5s cubic-bezier(.2,1.2,.35,1), top .5s cubic-bezier(.2,1.2,.35,1), width .5s cubic-bezier(.2,1.2,.35,1), height .5s cubic-bezier(.2,1.2,.35,1) }
.card.go { cursor: pointer }
.card.go:hover { box-shadow: inset 0 0 0 1px var(--amber), 0 14px 30px -14px rgba(0,0,0,.9) }
.row { display: flex; justify-content: space-between; gap: 10px; font: 600 12px var(--cond); letter-spacing: .14em; text-transform: uppercase; color: var(--mute) }
.status { color: var(--green) }
.status.amber { color: var(--amber) }
.flaps { display: flex; flex-wrap: wrap; gap: 6px 10px }
.word { display: inline-flex; gap: 2px; white-space: nowrap }
.fl { position: relative; display: inline-grid; place-items: center; min-width: .74em; height: 1.18em; padding: 0 .04em; background: linear-gradient(var(--flap-hi) 0 50%, var(--flap) 50% 100%);
  border-radius: 3px; font: 700 clamp(22px, 2.4vw, 34px)/1 var(--cond); text-transform: uppercase; color: var(--ink); transform-origin: 50% 50% }
.fl::after { content: ""; position: absolute; left: 0; right: 0; top: 50%; height: 1px; background: var(--seam) }
.small .fl { font-size: clamp(16px, 1.5vw, 21px) }
.card p { margin: 0; color: var(--mute); font-size: 14px }
.big .fl { font-size: clamp(26px, 2.8vw, 40px) }
.email { color: var(--amber); font: 500 13px var(--body); user-select: all; overflow-wrap: anywhere }
.bar { height: 6px; background: #000; margin-top: 8px } .bar span { display: block; height: 100%; background: repeating-linear-gradient(90deg, var(--amber) 0 6px, transparent 6px 8px) }
@media (max-width: 700px) { #stage { height: auto } header .board { display: none } }
</style>
</head>
<body>
<canvas id="field" aria-hidden="true"></canvas>
<header>
  <button class="back" id="back" type="button" hidden>◀ Back</button>
  <span class="board" id="crumb">Departures · Home</span>
  <span class="clock" id="clock"></span>
</header>
<main><div id="stage"></div></main>
<script src="kit2.js"></script>
<script src="kit3.js"></script>
<script>
const { PERSON, SECTIONS, SECTION, ITEMS, esc } = Kit
const CH = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789-&'

// Wall of tiny flaps; the ripple flips them as it passes
const field = Kit.Field(document.getElementById('field'), {
  spacing: 20, speed: 600, band: 80, life: 1700, push: 0, mousePush: 0, mouseRadius: 120,
  render(ctx, dots, W, H, now) {
    for (const d of dots) {
      const flip = d.e > .02 ? Math.abs(Math.cos(d.e * 9)) : 1
      const h = 12 * flip
      ctx.fillStyle = d.e > .25 ? '#f5b400' : '#1b1c1e'
      ctx.globalAlpha = d.e > .25 ? .25 + d.e * .5 : 1
      ctx.fillRect(d.bx - 7, d.by - h / 2, 14, h)
      ctx.globalAlpha = 1; ctx.fillStyle = '#0a0a0b'; ctx.fillRect(d.bx - 7, d.by - .5, 14, 1)
    }
  },
})

const clock = document.getElementById('clock')
setInterval(() => { clock.textContent = new Date().toTimeString().slice(0, 5) }, 1000); clock.textContent = new Date().toTimeString().slice(0, 5)

// Renders text as flap cells (grouped per word so words never split)
const flaps = text => `<div class="flaps">${text.toUpperCase().split(/\s+/).map(w => `<span class="word">${[...w].map(c => `<span class="fl" data-c="${esc(c)}">${esc(c)}</span>`).join('')}</span>`).join('')}</div>`
function clatter(el) {
  if (Kit.reduced) return
  el.querySelectorAll('.fl').forEach((s, i) => {
    const target = s.dataset.c
    let n = 5 + (i % 5)
    const tick = () => {
      if (n-- <= 0) { s.textContent = target; return }
      s.textContent = CH[(Math.random() * CH.length) | 0]
      s.animate([{ transform: 'scaleY(1)' }, { transform: 'scaleY(.05)' }, { transform: 'scaleY(1)' }], { duration: 60 })
      setTimeout(tick, 52)
    }
    setTimeout(tick, i * 22)
  })
}

function make(spec) {
  const el = document.createElement('article')
  el.className = 'card' + (spec.go ? ' go' : '')
  el.innerHTML = spec.html
  if (spec.go) Kit.pressable(el, () => go(spec.go))
  return el
}
const stage = Kit.Stage(document.getElementById('stage'), {
  make,
  layout: (k, W, H, ctx) => Kit.growLayout(k, W, H, { bento: ctx.home, cellH: 240, cellW: 360 }),
  interval: 230,
  enter: el => { clatter(el); el.animate([{ transform: 'rotateX(80deg)', opacity: 0 }, { transform: 'none', opacity: 1 }], { duration: 300, easing: 'cubic-bezier(.2,.9,.3,1)' }) },
  exit: el => el.animate([{ transform: 'none', opacity: 1 }, { transform: 'rotateX(-90deg)', opacity: 0 }], { duration: 170, easing: 'ease-in', fill: 'forwards' }),
  onSpawn: el => { const c = Kit.centerOf(el); field.ripple(c.x, c.y, el.dataset.big ? 1.3 : .9) },
})

const pad = n => String(n).padStart(2, '0')
const home = () => SECTIONS.map((s, i) => s.id === 'about'
  ? { go: 'about', html: `<div class="row"><span>Platform 0</span><span class="status">● ${esc(PERSON.status)}</span></div>
      <div class="big">${flaps(PERSON.name)}</div><p>${esc(PERSON.role)}</p><span class="email">${esc(PERSON.email)}</span>` }
  : { go: s.id, html: `<div class="row"><span>Gate ${pad(i + 1)} · ${s.path}</span><span class="status amber">${ITEMS[s.id].length} boarding</span></div>
      ${flaps(s.title)}<p>${esc(s.kicker)}</p>` })
const section = id => ITEMS[id].map((it, i) => ({ html: `<div class="row"><span>${pad(i + 1)} · ${esc(it.meta)}</span><span class="status">on time</span></div>
  <div class="small">${flaps(it.title)}</div><p>${esc(it.text)}</p>${it.progress != null ? `<div class="bar"><span style="width:${it.progress * 100}%"></span></div>` : ''}` }))

const backBtn = document.getElementById('back'), crumb = document.getElementById('crumb')
const go = Kit.runApp(stage, {
  home, section,
  onView: t => { backBtn.hidden = t === 'home'; crumb.textContent = 'Departures · ' + (t === 'home' ? 'Home' : t === 'about' ? 'About' : SECTION[t].title) },
  afterSpawn: t => (t === 'home' ? document.querySelector('.card.go') : backBtn).focus({ preventScroll: true }),
})
backBtn.addEventListener('click', () => go('home'))
go('home')
</script>
</body>
</html>
