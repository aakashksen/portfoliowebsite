<style>
/* v3.1: Experience + Projects on the left, me in the middle, the resume on the right.

:root {
  --bg: #08090b; --card: #0f1013; --card-hi: #15161a; --panel: #0d0e11;

  --r: 8px;
  color-scheme: dark;
}
* { box-sizing: border-box }
html { -webkit-text-size-adjust: 100% }

button { font: inherit; color: inherit }

svg { flex: none }
#field { position: fixed; inset: 0; width: 100%; height: 100% }
:focus-visible { outline: 2px solid var(--cs); outline-offset: 3px }

/* Header: only a way back, shown once you leave home */

  padding-inline: max(16px, env(safe-area-inset-left, 0px)) max(16px, env(safe-area-inset-right, 0px)) }
.crumb { font: 400 13px var(--mono); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis }

main { position: relative; padding: 4px max(16px, env(safe-area-inset-right, 0px)) 48px max(16px, env(safe-area-inset-left, 0px)) }

.card.compact > * { opacity: 0 }
.head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px }

/* Buttons */

.pent { position: relative; padding: 5px 10px; margin: 0 -10px; border-radius: 6px; transition: background .15s, box-shadow .15s }

const stageEl = document.getElementById('stage')
let cards = [], view = null, busy = false
const GAP = 16
const viewH = () => Math.min(stageEl.clientHeight, innerHeight - 112)
const narrow = () => innerWidth <= 700
function measure(el, w) {
  const t = el.style.transition, ow = el.style.width, oh = el.style.height
  el.style.transition = 'none'; el.style.width = w + 'px'; el.style.height = 'auto'
  const n = el.offsetHeight
  el.style.width = ow; el.style.height = oh; el.style.transition = t
  return n
}
// Home cards are always in this order: experience, resume, projects, live, about.
// Intro (4 cards): a tight 2x2 square. Full (5): those four in the corners, About in the tall centre column.
function homeLayout(k, els) {
  const W = stageEl.clientWidth, H = viewH()
  if (narrow()) {
    const order = k === 5 ? [4, 0, 2, 1, 3] : [0, 2, 1, 3], out = []
    let y = 0
    for (const i of order) {
      const el = els && els[i], min = i === 4 ? 560 : i === 1 ? 380 : 180
      const h = i === 1 ? min : el ? Math.max(min, measure(el, W)) : min
      out[i] = { x: 0, y, w: W, h }; y += h + GAP
    }
    return out
  }
  if (k === 4) {
    const s = 140, g = 10, x0 = (W - (2 * s + g)) / 2, y0 = (H - (2 * s + g)) / 2
    return [0, 1, 2, 3].map(i => ({ x: x0 + (i % 2) * (s + g), y: y0 + Math.floor(i / 2) * (s + g), w: s, h: s }))
  }
  const maxW = Math.min(W, 1180), cw = (maxW - 2 * GAP) / 3, ch = Math.min(310, (H - GAP) / 2), full = 2 * ch + GAP
  const x0 = (W - maxW) / 2, y0 = Math.max(0, (H - full) / 2), xr = x0 + 2 * (cw + GAP)
  return [{ x: x0, y: y0, w: cw, h: ch }, { x: xr, y: y0, w: cw, h: ch },
    { x: x0, y: y0 + ch + GAP, w: cw, h: ch }, { x: xr, y: y0 + ch + GAP, w: cw, h: ch },
    { x: x0 + cw + GAP, y: y0, w: cw, h: full }]
}
function entryLayout(els) {
  const k = els.length, W = stageEl.clientWidth, cols = Math.min(k, W >= 1150 ? 3 : W >= 720 ? 2 : 1)
  const cw = Math.min(380, (W - GAP * (cols - 1)) / cols)
  const hs = els.map(el => measure(el, cw))
  const rows = Math.ceil(k / cols), rowH = []
  for (let r = 0; r < rows; r++) rowH.push(Math.max(240, ...hs.slice(r * cols, r * cols + cols)))
  const totalH = rowH.reduce((a, b) => a + b, 0) + (rows - 1) * GAP
  let y = Math.max(0, (viewH() - totalH) / 2)
  const out = []
  for (let r = 0; r < rows; r++) {
    const inRow = Math.min(cols, k - r * cols), rowW = inRow * cw + (inRow - 1) * GAP
    for (let c = 0; c < inRow; c++) out.push({ x: (W - rowW) / 2 + c * (cw + GAP), y, w: cw, h: rowH[r] })
    y += rowH[r] + GAP
  }
  return out
}

}

const paperRO = new ResizeObserver(es => es.forEach(e => e.target.style.setProperty('--s', e.contentRect.width / 816)))

function make(spec) {
  const el = document.createElement('article')
  el.className = 'card ' + (spec.cls || '')
  el.innerHTML = spec.html
  el.spec = spec
  el.addEventListener('click', e => {
    const row = e.target.closest('[data-open]')
    if (row) { e.stopPropagation(); field.ripple(e.clientX, e.clientY, 1.4); const [sec, i] = row.dataset.open.split(':'); openItem(sec, ITEMS[sec][+i], el); return }
    const mail = e.target.closest('[data-mail]')

  })
  if (spec.go || spec.zoom) {
    Kit.pressable(el, e => {
      if (e && e.target && e.target.closest && e.target.closest('a, button, [data-open]')) return
      clickRipple(el)

const settle = (p, ms) => Promise.race([p, new Promise(r => setTimeout(r, ms + 150))])
async function addGroup(specs, rectsFor, P, stagger = 45, extra) {
  const fresh = specs.map(make)
  if (extra) fresh.forEach(extra)
  fresh.forEach(el => stageEl.append(el))
  cards.push(...fresh)
  const rects = typeof rectsFor === 'function' ? rectsFor(cards) : rectsFor
  cards.forEach((c, i) => place(c, rects[i], fresh.includes(c)))
  fit(rects)
  if (Kit.reduced) return fresh
  await Promise.all(fresh.map((el, i) => {
    const r = el.getBoundingClientRect()
    return el.animate([{ transform: `translate(${P.x - (r.left + r.width / 2)}px,${P.y - (r.top + r.height / 2)}px) scale(.25)`, opacity: 0 }, { transform: 'none', opacity: 1 }],
      { duration: 480, delay: i * stagger, easing: 'cubic-bezier(.2,1.1,.35,1)', fill: 'backwards' }).finished

}
async function clearAll(P) {

  if (!Kit.reduced) await Promise.all(old.map((el, i) => {
    const r = el.getBoundingClientRect()
    return el.animate([{ transform: 'none', opacity: 1 }, { transform: `translate(${P.x - (r.left + r.width / 2)}px,${P.y - (r.top + r.height / 2)}px) scale(.25)`, opacity: 0 }],

// ---------- Intro ----------
// Four squares pop in at the centre and grow into the real cards, huddled together. Then my card opens from the
// seam between them and shoves both columns out to their places. Everything is driven by damped springs.
function springs(list, step, maxMs = 2000) {
  return new Promise(done => {
    let last = performance.now(), t0 = last, over = false
    const finish = () => { if (!over) { over = true; list.forEach(s => { s.x = s.to; s.v = 0 }); step(); done() } }
    setTimeout(finish, maxMs + 300) // rAF stops in background tabs
    function frame(now) {
      if (over) return
      const dt = Math.min(.034, (now - last) / 1000), n = 4; last = now
      for (let k = 0; k < n; k++) for (const s of list) {
        if (now - t0 < (s.delay || 0)) continue
        s.v += (-s.k * (s.x - s.to) - s.c * s.v) * dt / n; s.x += s.v * dt / n
      }
      step(now - t0)
      if (list.every(s => Math.abs(s.x - s.to) < .3 && Math.abs(s.v) < 4) || now - t0 > maxMs) return finish()
      requestAnimationFrame(frame)
    }
    requestAnimationFrame(frame)
  })
}
async function intro() {
  busy = true; view = 'home'; chrome()
  if (narrow() || Kit.reduced) {
    await addGroup(HOME.map(homeCard), els => homeLayout(5, els), centerOfStage(), 30)
    busy = false; return
  }
  const R = homeLayout(5), A = R[4]
  const cx = A.x + A.w / 2, cy = A.y + A.h / 2, s0 = 128, g0 = 10
  const stageBox = stageEl.getBoundingClientRect(), P = { x: stageBox.left + cx, y: stageBox.top + cy }
  // 1. Four squares pop in, tight around the exact point the finished layout is centred on
  const square = [0, 1, 2, 3].map(i => ({ x: cx + (i % 2 ? g0 / 2 : -g0 / 2 - s0), y: cy + (i < 2 ? -g0 / 2 - s0 : g0 / 2), w: s0, h: s0 }))
  softRipple(P, .7)
  const four = await addGroup(HOME.slice(0, 4).map(homeCard), square, P, 55, el => el.classList.add('compact'))
  await Kit.wait(120)
  const set = (el, x, y, ww, hh) => Object.assign(el.style, { left: x + 'px', top: y + 'px', width: ww + 'px', height: hh + 'px' })
  const corners = (w, h, gx, gy, ax, aw, off) => {
    const L = ax - gx - w - off, Rx = ax + aw + gx + off, T = cy - gy / 2 - h, B = cy + gy / 2
    set(four[0], L, T, w, h); set(four[1], Rx, T, w, h); set(four[2], L, B, w, h); set(four[3], Rx, B, w, h)
  }
  four.forEach(c => { c.style.transition = 'none' })
  // 2. They grow into the real cards, still huddled at the centre, and their content appears
  const grow = { cw: { x: s0, v: 0, to: R[0].w, k: 170, c: 22 }, ch: { x: s0, v: 0, to: R[0].h, k: 170, c: 22 } }
  let shownC = false
  await springs(Object.values(grow), () => {
    corners(grow.cw.x, grow.ch.x, g0 / 2, g0, cx, 0, 0)
    if (!shownC && grow.cw.x > s0 + (R[0].w - s0) * .6) { shownC = true; four.forEach(el => el.classList.remove('compact')) }
  }, 1200)
  four.forEach(el => el.classList.remove('compact'))
  fit(R)
  await Kit.wait(160)
  // 3. My card opens from the seam between them and shoves both columns out to their places
  const about = make(homeCard('about'))
  about.classList.add('compact'); about.style.transition = 'none'; stageEl.append(about); cards.push(about)
  const sp = {
    aw: { x: 0, v: 0, to: A.w, k: 190, c: 21 },               // my card's width: fast, slight overshoot
    ah: { x: 2 * R[0].h + g0, v: 0, to: A.h, k: 220, c: 30 },
    gx: { x: g0 / 2, v: 0, to: GAP, k: 220, c: 30 },
    gy: { x: g0, v: 0, to: GAP, k: 220, c: 30 },
    kick: { x: 0, v: 200, to: 0, k: 150, c: 13, delay: 200 }, // the shove: ~11px recoil, then back to contact
  }
  softRipple(P, 1.2)
  let shownA = false
  await springs(Object.values(sp), () => {
    const aw = Math.max(0, sp.aw.x), ax = cx - aw / 2
    corners(R[0].w, R[0].h, sp.gx.x, sp.gy.x, ax, aw, sp.kick.x)
    set(about, ax, cy - sp.ah.x / 2, aw, sp.ah.x)
    about.style.borderWidth = aw < 2 ? '0' : ''
    if (!shownA && aw > A.w * .55) { shownA = true; about.classList.remove('compact') }
  })
  cards.forEach((c, i) => { place(c, R[i], true); c.style.transition = ''; c.classList.remove('compact') })
  about.style.borderWidth = ''
  busy = false
}
async function go(target, fromEl) {
  if (busy || target === view) return
  busy = true
  const P = fromEl ? Kit.centerOf(fromEl) : centerOfStage()
  await clearAll(P)
  view = target; chrome(); scrollTo(0, 0)
  if (target === 'home') await addGroup(HOME.map(homeCard), els => homeLayout(5, els), P, 25)
  else await addGroup(ITEMS[target].map(entryCard), entryLayout, P, 45)
  softRipple(P, .5)
  ;(target === 'home' ? stageEl.querySelector('.card[role=button]') : backBtn).focus({ preventScroll: true })
  busy = false
}
// Jump straight to one write-up: spawn its section, then zoom into its card
async function openItem(sec, item, fromEl) {
  if (zoomState) await closeZoom()
  if (busy) return
  await go(sec, fromEl && fromEl.isConnected ? fromEl : null)
  const card = cards.find(c => c.spec.item === item)
  if (card) await openZoom(card, { kind: 'item', item, card })
}
async function openSection(sec) {
  if (zoomState) await closeZoom()
  await go(sec, null)
}

// ---------- Zoom ----------
function zoomTarget() {
  const pad = innerWidth < 700 ? 8 : 24, top = 60
  return { x: pad + Math.max(0, (innerWidth - 2 * pad - 1180) / 2), y: top, w: Math.min(1180, innerWidth - 2 * pad), h: innerHeight - top - pad }
}
async function openZoom(src, { kind, item, card }) {
  if (busy || zoomState) return
  busy = true
  const title = item ? item.title : kind
  const from = src.getBoundingClientRect(), to = zoomTarget()
  const z = document.createElement('section')
  z.className = 'zoom'
  z.setAttribute('role', 'dialog'); z.setAttribute('aria-modal', 'true'); z.setAttribute('aria-label', title)
  z.innerHTML = `${card ? `<div class="short">${card.innerHTML}</div>` : ''}<div class="long">${longHTML(kind, item)}</div><button class="x" type="button">Close ✕</button>`
  Object.assign(z.style, { left: to.x + 'px', top: to.y + 'px', width: to.w + 'px', height: to.h + 'px' })
  document.body.append(z)
  zoomState = { el: z, src, card, title: title.toLowerCase() }
  z.querySelector('.x').addEventListener('click', closeZoom)
  z.addEventListener('click', e => {
    const t = e.target
    const jump = t.closest('[data-jump]'); if (jump) { z.querySelector('#' + jump.dataset.jump).scrollIntoView({ behavior: Kit.reduced ? 'auto' : 'smooth', block: 'start' }); return }
    const more = t.closest('[data-section]'); if (more) { openSection(more.dataset.section); return }
    if (t.closest('a')) { const m = t.closest('[data-mail]'); if (m) copyMail(m); return }
    const ent = t.closest('[data-item]'); if (ent) { const [sec, i] = ent.dataset.item.split(':'); openItem(sec, ITEMS[sec][+i]) }
  })
  z.addEventListener('keydown', e => { const ent = e.target.closest && e.target.closest('[data-item]'); if (ent && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); e.stopPropagation(); ent.click() } })
  if (card) card.style.visibility = 'hidden'
  stageEl.classList.add('dim'); chrome()
  if (!Kit.reduced) {
    const sx = from.width / to.w, sy = from.height / to.h
    const opts = { duration: 500, easing: 'cubic-bezier(.2,.9,.25,1)' }
    z.animate([{ transform: `translate(${from.left - to.x}px,${from.top - to.y}px) scale(${sx},${sy})` }, { transform: 'none' }], opts)
    const sh = z.querySelector('.short'); if (sh) sh.animate([{ opacity: 1 }, { opacity: 0, offset: .3 }, { opacity: 0 }], opts)
    z.querySelector('.long').animate([{ opacity: 0, transform: 'translateY(14px)' }, { opacity: 0, offset: .4 }, { opacity: 1, transform: 'none' }], opts)
    await Kit.wait(500)
  }
  const sh = z.querySelector('.short'); if (sh) sh.remove()
  z.querySelector('.x').focus({ preventScroll: true })
  busy = false
}
async function closeZoom() {
  if (!zoomState || busy) return
  busy = true
  const { el: z, src, card } = zoomState
  const to = src.getBoundingClientRect(), from = z.getBoundingClientRect()
  stageEl.classList.remove('dim')
  if (!Kit.reduced) {
    z.querySelector('.long').animate([{ opacity: 1 }, { opacity: 0 }], { duration: 150, fill: 'forwards' })
    await z.animate([{ transform: 'none', opacity: 1 }, { transform: `translate(${to.left - from.left}px,${to.top - from.top}px) scale(${to.width / from.width},${to.height / from.height})`, opacity: .4 }],
      { duration: 360, easing: 'cubic-bezier(.4,0,.2,1)', fill: 'forwards' }).finished
  }
  z.remove(); if (card) card.style.visibility = ''
  zoomState = null; chrome()
  if (src.isConnected) src.focus({ preventScroll: true })
  busy = false
}

backBtn.addEventListener('click', () => { if (zoomState) closeZoom(); else { clickRipple(backBtn); go('home', backBtn) } })
Kit.onBack(() => zoomState ? closeZoom() : view !== 'home' && go('home', backBtn))
intro()
</script>
