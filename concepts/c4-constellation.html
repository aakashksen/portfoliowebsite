<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Constellation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@500;700;800&family=DM+Sans:opsz,wght@9..40,400;9..40,500&display=swap">
<style>
/* Layout: About is the hub in the middle of a 3x3 field; the four sections sit at the corners and get linked to it by light */
:root {
  --night: #060914; --night-2: #0c1226; --star: #dfe7ff; --ice: #a9c7ff; --warm: #ffd2a1; --mute: #8590ad; --edge: rgba(169,199,255,.22);
  --display: "Syne", "Trebuchet MS", sans-serif; --body: "DM Sans", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box }
html, body { margin: 0; color: var(--star); font: 15px/1.5 var(--body); background: var(--night) }
body { background: radial-gradient(1200px 800px at 50% 45%, var(--night-2), var(--night) 70%) fixed }
#field { position: fixed; inset: 0; width: 100%; height: 100% }
main { position: relative; min-height: 100vh; display: grid; place-items: center;
  padding-block: 40px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
.sky { width: 100%; max-width: 1040px; display: grid; gap: 28px 40px;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr) minmax(0, 1fr); grid-template-areas: "p . e" ". a ." "b . c" }
.node { display: flex; align-items: center; gap: 14px; padding: 14px 18px; border: 1px solid var(--edge); border-radius: 999px;
  background: rgba(6,9,20,.72); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); cursor: pointer;
  transition: border-color .2s, box-shadow .25s, translate .25s }
.node:hover, .node:focus-visible { border-color: var(--ice); box-shadow: 0 0 32px rgba(169,199,255,.25); translate: 0 -2px; outline: none }
.star { flex: none; width: 12px; height: 12px; border-radius: 50%; background: var(--warm); box-shadow: 0 0 14px 3px rgba(255,210,161,.55) }
.node h2 { margin: 0; font: 700 20px/1.1 var(--display); letter-spacing: .01em }
.node p { margin: 2px 0 0; color: var(--mute); font-size: 13px }
.hub { grid-area: a; text-align: center; padding: 34px 28px; border-radius: 28px; border: 1px solid var(--edge); background: rgba(8,12,28,.8);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); display: flex; flex-direction: column; align-items: center; gap: 12px; cursor: pointer;
  box-shadow: 0 0 80px rgba(120,150,255,.12) }
.hub:focus-visible { outline: 2px solid var(--ice); outline-offset: 4px }
.hub .core { width: 18px; height: 18px; border-radius: 50%; background: #fff; box-shadow: 0 0 24px 8px rgba(169,199,255,.6) }
.hub h1 { margin: 6px 0 0; font: 800 clamp(28px, 3vw, 38px)/1.05 var(--display); letter-spacing: -.01em; text-wrap: balance }
.hub .role { color: var(--ice); margin: 0 }
.hub .email { color: var(--mute); font-size: 14px; user-select: all }
.chips { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px }
.chip { font-size: 12px; padding: 4px 10px; border-radius: 999px; border: 1px solid var(--edge); color: var(--star) }
.status { font-size: 13px; color: var(--warm) }
.coord { font-size: 11px; color: var(--mute); letter-spacing: .12em; text-transform: uppercase }
dialog { margin: 0 0 0 auto; height: 100%; max-height: none; width: min(480px, 100vw); border: 0; border-left: 1px solid var(--edge);
  background: rgba(8,12,28,.96); color: var(--star); padding: 36px 30px }
dialog::backdrop { background: rgba(2,3,8,.55) }
dialog[open] { animation: slide .45s cubic-bezier(.16,1,.3,1) }
@keyframes slide { from { transform: translateX(40px); opacity: 0 } }
dialog h3 { font: 800 40px/1.05 var(--display); margin: 16px 0 8px }
dialog .coord { color: var(--warm) }
.close { background: none; border: 1px solid var(--edge); color: var(--star); border-radius: 999px; padding: 6px 14px; font: inherit; font-size: 13px; cursor: pointer }
.note { color: var(--mute); font-size: 13px; border-top: 1px solid var(--edge); padding-top: 12px }
@media (max-width: 820px) {
  .sky { grid-template-columns: 1fr; grid-template-areas: "a" "p" "e" "b" "c"; gap: 16px }
}
</style>
</head>
<body>
<canvas id="field" aria-hidden="true"></canvas>
<main>
  <div class="sky">
    <div class="node" data-id="projects" style="grid-area:p"><span class="star"></span><div><h2>Projects</h2><p>My creative work</p></div></div>
    <div class="node" data-id="experience" style="grid-area:e"><span class="star"></span><div><h2>Experience</h2><p>My professional journey</p></div></div>
    <section class="hub" data-id="about">
      <span class="core"></span>
      <span class="coord">RA 00h 00m · Dec +00°</span>
      <h1 data-person="name"></h1>
      <p class="role" data-person="role"></p>
      <span class="email" data-person="email" data-noopen></span>
      <div class="chips" data-skills="chip"></div>
      <span class="status">✦ <span data-person="status"></span></span>
    </section>
    <div class="node" data-id="blog" style="grid-area:b"><span class="star"></span><div><h2>Blog</h2><p>Thoughts &amp; insights</p></div></div>
    <div class="node" data-id="current" style="grid-area:c"><span class="star"></span><div><h2>Current Work</h2><p>What I'm building now</p></div></div>
  </div>
</main>
<dialog id="panel" aria-labelledby="panel-title">
  <button class="close" data-close>Close</button>
  <h3 id="panel-title" data-slot="title"></h3>
  <div class="coord" data-slot="path"></div>
  <p data-slot="kicker"></p>
  <p data-slot="body"></p>
  <p class="note">Placeholder content. This section is still being built.</p>
</dialog>
<script src="shared.js"></script>
<script>
const hash = n => { const x = Math.sin(n * 127.1) * 43758.5453; return x - Math.floor(x) }
const hub = document.querySelector('.hub')
const sats = ['projects', 'experience', 'blog', 'current'].map(id => document.querySelector(`[data-id="${id}"]`))
const LINK_START = 420, LINK_GAP = 150, LINK_DUR = 380
let t0 = Kit.reduced ? -1e9 : performance.now()

const field = Kit.Field(document.getElementById('field'), {
  spacing: 26, speed: 600, band: 90, life: 2000, push: 12, mouseRadius: 150, mousePush: 6, ambient: true,
  render(ctx, dots, W, H, now, mouse) {
    const mouseOn = now - mouse.t < 1500
    for (const d of dots) {
      if (hash(d.i) < 0.5) continue
      const x = d.x + (hash(d.i + 7) - .5) * 22, y = d.y + (hash(d.i + 3) - .5) * 22
      const big = hash(d.i + 11)
      const tw = Kit.reduced ? 1 : 0.65 + 0.35 * Math.sin(now * 0.0015 + d.i)
      ctx.globalAlpha = Math.min(1, (0.12 + big * 0.35) * tw + d.e * 0.8)
      ctx.fillStyle = big > .92 ? '#ffd2a1' : '#dfe7ff'
      const s = (big > .92 ? 2 : 1.1) + d.e * 1.6
      ctx.fillRect(x - s / 2, y - s / 2, s, s)
      if (mouseOn) {
        const dist = Math.hypot(x - mouse.x, y - mouse.y)
        if (dist < 130) {
          ctx.globalAlpha = (1 - dist / 130) * 0.45
          ctx.strokeStyle = '#a9c7ff'; ctx.lineWidth = .6
          ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(mouse.x, mouse.y); ctx.stroke()
        }
      }
    }
    // Light links from the hub to each section node
    const h = Kit.centerOf(hub)
    ctx.lineWidth = 1.2
    sats.forEach((s, i) => {
      const p = Math.max(0, Math.min(1, (now - t0 - LINK_START - i * LINK_GAP) / LINK_DUR))
      if (!p) return
      const c = Kit.centerOf(s)
      const ex = h.x + (c.x - h.x) * p, ey = h.y + (c.y - h.y) * p
      const g = ctx.createLinearGradient(h.x, h.y, ex, ey)
      g.addColorStop(0, 'rgba(169,199,255,.05)'); g.addColorStop(1, 'rgba(255,210,161,.7)')
      ctx.globalAlpha = 1; ctx.strokeStyle = g
      ctx.beginPath(); ctx.moveTo(h.x, h.y); ctx.lineTo(ex, ey); ctx.stroke()
    })
    ctx.globalAlpha = 1
  },
})
Kit.fillPerson()
Kit.wirePanels(field)

Kit.assemble([hub, ...sats], (el, i) => i === 0
  ? { delay: 0, duration: 700, keyframes: [{ transform: 'scale(.6)', opacity: 0, filter: 'blur(12px)' }, { transform: 'none', opacity: 1, filter: 'blur(0)' }] }
  : { delay: LINK_START + (i - 1) * LINK_GAP + LINK_DUR - 80, duration: 480, easing: 'cubic-bezier(.34,1.4,.64,1)',
      keyframes: [{ transform: 'scale(.3)', opacity: 0 }, { transform: 'none', opacity: 1 }] },
  (el, instant) => { if (!instant) { const c = Kit.centerOf(el); field.ripple(c.x, c.y, el === hub ? 1.3 : .7) } })
</script>
</body>
</html>
