<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Halftone Press</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Work+Sans:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap">
<style>
/* Layout: chunky 3-column paste-up, cards slightly askew with hard offset shadows; About is the blue centre slab */
:root {
  --sun: #ffd23f; --ink: #121212; --paper: #fffbea; --blue: #1f48d6; --on-blue: #fffbea; --mute: #4a4536;
  --display: "Anton", Impact, "Arial Narrow", sans-serif; --body: "Work Sans", system-ui, sans-serif; --mono: "Space Mono", ui-monospace, monospace;
  color-scheme: light;
}
* { box-sizing: border-box }
html, body { margin: 0; background: var(--sun); color: var(--ink); font: 16px/1.45 var(--body) }
#field { position: fixed; inset: 0; width: 100%; height: 100% }
main { position: relative; min-height: 100vh; display: grid; place-items: center;
  padding-block: 44px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
.board { width: 100%; max-width: 1120px; display: grid; gap: 22px; grid-template-columns: repeat(3, minmax(0, 1fr)); grid-template-areas: "p a e" "b a c" }
.card { background: var(--paper); border: 3px solid var(--ink); box-shadow: 8px 8px 0 var(--ink); padding: 18px 20px; min-height: 220px; cursor: pointer;
  display: flex; flex-direction: column; justify-content: space-between; gap: 20px; transition: translate .15s, box-shadow .15s }
.card:hover, .card:focus-visible { translate: -4px -4px; box-shadow: 12px 12px 0 var(--ink); outline: none }
.card:active { translate: 4px 4px; box-shadow: 2px 2px 0 var(--ink) }
.card:nth-child(1) { rotate: -1.6deg } .card:nth-child(2) { rotate: 1.2deg } .card:nth-child(4) { rotate: 1.8deg } .card:nth-child(5) { rotate: -1deg }
.tag { align-self: flex-start; font: 700 12px var(--mono); text-transform: uppercase; background: var(--ink); color: var(--sun); padding: 3px 8px }
.card h2 { margin: 0; font: 400 clamp(40px, 4.6vw, 64px)/.9 var(--display); text-transform: uppercase; letter-spacing: .005em }
.card p { margin: 6px 0 0; font-weight: 500 }
.about { grid-area: a; background: var(--blue); color: var(--on-blue); justify-content: flex-start; gap: 16px }
.about .tag { background: var(--sun); color: var(--ink) }
.about h1 { margin: 0; font: 400 clamp(52px, 6vw, 84px)/.86 var(--display); text-transform: uppercase; overflow-wrap: anywhere }
.about .role { font-weight: 700; font-size: 18px; margin: 0 }
.about .email { font: 700 14px var(--mono); background: var(--paper); color: var(--ink); padding: 6px 10px; align-self: flex-start; border: 2px solid var(--ink); user-select: all; max-width: 100%; overflow-wrap: anywhere }
.stickers { display: flex; flex-wrap: wrap; gap: 8px; margin-top: auto }
.sticker { font: 700 13px var(--mono); background: var(--sun); color: var(--ink); border: 2px solid var(--ink); padding: 4px 10px; border-radius: 999px }
.sticker:nth-child(2) { rotate: -4deg } .sticker:nth-child(3) { rotate: 3deg }
.status { font: 700 13px var(--mono); text-transform: uppercase }
.status::before { content: "● "; color: #6dff9c }
dialog { width: min(600px, calc(100vw - 32px)); background: var(--paper); color: var(--ink); border: 3px solid var(--ink); box-shadow: 12px 12px 0 var(--ink); padding: 0 }
dialog::backdrop { background: rgba(18,18,18,.4) }
dialog[open] { animation: slam .35s cubic-bezier(.34,1.56,.64,1) }
@keyframes slam { from { transform: scale(1.15) rotate(-2deg); opacity: 0 } }
.dhead { display: flex; justify-content: space-between; align-items: center; background: var(--blue); color: var(--on-blue); padding: 10px 16px; border-bottom: 3px solid var(--ink); font: 700 13px var(--mono) }
.dbody { padding: 18px 22px 24px }
dialog h3 { margin: 4px 0 10px; font: 400 60px/.9 var(--display); text-transform: uppercase }
.close { background: var(--sun); border: 2px solid var(--ink); font: 700 12px var(--mono); padding: 4px 10px; cursor: pointer; color: var(--ink) }
.note { font: 12px var(--mono); color: var(--mute); border-top: 2px dashed var(--ink); padding-top: 12px }
@media (max-width: 820px) {
  .board { grid-template-columns: 1fr; grid-template-areas: "a" "p" "e" "b" "c" }
  .card { min-height: 160px }
}
</style>
</head>
<body>
<canvas id="field" aria-hidden="true"></canvas>
<main id="main">
  <div class="board">
    <article class="card" data-id="projects" style="grid-area:p"><span class="tag">/projects</span><div><h2>Projects</h2><p>My creative work</p></div></article>
    <article class="card" data-id="experience" style="grid-area:e"><span class="tag">/experience</span><div><h2>Experience</h2><p>My professional journey</p></div></article>
    <article class="card about" data-id="about">
      <span class="tag">Hello, I'm</span>
      <h1 data-person="name"></h1>
      <p class="role" data-person="role"></p>
      <span class="email" data-person="email" data-noopen></span>
      <span class="status" data-person="status"></span>
      <div class="stickers" data-skills="sticker"></div>
    </article>
    <article class="card" data-id="blog" style="grid-area:b"><span class="tag">/blog</span><div><h2>Blog</h2><p>Thoughts &amp; insights</p></div></article>
    <article class="card" data-id="current" style="grid-area:c"><span class="tag">/now</span><div><h2>Current Work</h2><p>What I'm building now</p></div></article>
  </div>
</main>
<dialog id="panel" aria-labelledby="panel-title">
  <div class="dhead"><span data-slot="path"></span><button class="close" data-close>Close ✕</button></div>
  <div class="dbody">
    <h3 id="panel-title" data-slot="title"></h3>
    <p data-slot="kicker"></p>
    <p data-slot="body"></p>
    <p class="note">Placeholder content. This section is still being built.</p>
  </div>
</dialog>
<script src="shared.js"></script>
<script>
const field = Kit.Field(document.getElementById('field'), {
  spacing: 14, speed: 750, band: 100, life: 1700, push: 4, mouseRadius: 130, mousePush: 2,
  render(ctx, dots, W, H) {
    ctx.fillStyle = '#121212'
    ctx.beginPath()
    for (const d of dots) {
      // Classic halftone falloff toward the bottom-right corner, plus ripple swell
      const corner = Math.max(0, 1 - Math.hypot(W - d.bx, H - d.by) / (Math.max(W, H) * .75))
      const r = 0.6 + corner * corner * 3.6 + d.e * 5.2
      ctx.moveTo(d.x + r, d.y)
      ctx.arc(d.x, d.y, r, 0, Math.PI * 2)
    }
    ctx.fill()
  },
})
Kit.fillPerson()
Kit.wirePanels(field)

const main = document.getElementById('main')
const order = ['projects', 'experience', 'blog', 'current', 'about'].map(id => document.querySelector(`[data-id="${id}"]`))
Kit.assemble(order, (el, i) => ({
  delay: i * 120, duration: 620, easing: 'cubic-bezier(.34,1.5,.64,1)',
  keyframes: [{ transform: `translateY(${-innerHeight - 200}px) rotate(${i % 2 ? 9 : -9}deg)` }, { transform: 'none' }],
}), (el, instant) => {
  if (instant) return
  const c = Kit.centerOf(el)
  field.ripple(c.x, c.y, el.dataset.id === 'about' ? 1.4 : .8)
  main.animate([{ translate: '0 0' }, { translate: '0 5px' }, { translate: '0 -2px' }, { translate: '0 0' }], { duration: 180 })
})
</script>
</body>
</html>
